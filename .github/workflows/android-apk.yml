name: Android QA APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build standalone direct Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already includes the Android SDK. Avoid
      # android-actions/setup-android: its default "tools" package is obsolete.
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          APP_VARIANT: direct
        run: pnpm exec expo prebuild --platform android --no-install --clean

      # IMPORTANT: A debug build skips Metro bundling for the debuggable variant.
      # It therefore opens the Expo development launcher and requires a dev server.
      # A release APK embeds assets/index.android.bundle and runs independently.
      - name: Build standalone release APK
        working-directory: apps/mobile/android
        env:
          APP_VARIANT: direct
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK package, signature, and embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          echo "Checking embedded React Native bundle..."
          unzip -Z1 "$APK" | grep -Fx "assets/index.android.bundle"
          BUNDLE_BYTES="$(unzip -p "$APK" assets/index.android.bundle | wc -c)"
          test "$BUNDLE_BYTES" -gt 0
          echo "Embedded JavaScript bundle: ${BUNDLE_BYTES} bytes"

          echo "Checking package identifier..."
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.wizzyfrosh.mediavault.direct'"

          echo "Checking APK signature..."
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-direct-android-standalone-qa-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
