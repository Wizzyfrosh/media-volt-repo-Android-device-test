name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (store flavor)
        run: pnpm --filter @mediavault/mobile exec env APP_VARIANT=store jest
      - name: Tests (direct flavor)
        run: pnpm --filter @mediavault/mobile exec env APP_VARIANT=direct jest

  store-bundle-check:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Store bundle must contain no extractor code
        run: pnpm --filter @mediavault/mobile check:store-bundle
